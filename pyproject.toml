[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-agent-capture"
version = "0.1.0"
description = "Local microphone and camera capture layer for Care Agent"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "sounddevice>=0.4.6",
]

[project.scripts]
care-capture = "capture.cli:main"

[tool.setuptools.packages.find]
include = ["capture*"]

